<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Алина · Design Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f3ee;
    color: #1a1a1a;
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    padding: 20px 24px;
    background: #ffffff;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #4A4744;
    color: #F5F3EF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .header-info h1 {
    font-size: 15px;
    font-weight: 500;
    color: #1a1a1a;
    letter-spacing: 0.2px;
  }

  .header-info p {
    font-size: 12px;
    color: #888;
    font-weight: 400;
    margin-top: 2px;
    letter-spacing: 0.3px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .message {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.6;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .message.bot {
    align-self: flex-start;
    background: #ffffff;
    color: #1a1a1a;
    border: 1px solid rgba(0, 0, 0, 0.06);
  }

  .message.user {
    align-self: flex-end;
    background: #4A4744;
    color: #F5F3EF;
  }

  .typing {
    align-self: flex-start;
    padding: 14px 16px;
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 10px;
    display: flex;
    gap: 4px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    background: #999;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-4px); }
  }

  .input-area {
    padding: 16px 20px;
    background: #ffffff;
    border-top: 1px solid rgba(0, 0, 0, 0.06);
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .input-area input {
    flex: 1;
    border: 1px solid rgba(0, 0, 0, 0.1);
    background: #fafaf8;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    color: #1a1a1a;
    outline: none;
    transition: border-color 0.15s;
  }

  .input-area input:focus {
    border-color: #4A4744;
  }

  .input-area button {
    background: #4A4744;
    color: #F5F3EF;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s;
    letter-spacing: 0.3px;
  }

  .input-area button:hover { opacity: 0.85; }
  .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="avatar">A</div>
  <div class="header-info">
    <h1>Алина</h1>
    <p>Design Planner · ассистент</p>
  </div>
</div>

<div class="messages" id="messages">
  <div class="message bot">Здравствуйте! Я Алина, ассистент студии Design Planner. Расскажу про услуги, тарифы и процесс работы. С чем могу помочь?</div>
</div>

<div class="input-area">
  <input type="text" id="input" placeholder="Напишите сообщение..." autocomplete="off">
  <button id="send">Отправить</button>
</div>

<script>
  const API_URL = "/chat";
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const history = [];

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "message " + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    history.push({ role: "user", content: text });
    inputEl.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      hideTyping();

      if (data.reply) {
        addMessage(data.reply, "bot");
        history.push({ role: "assistant", content: data.reply });
      } else {
        addMessage("Извините, что-то пошло не так. Попробуйте позже.", "bot");
      }
    } catch (e) {
      hideTyping();
      addMessage("Нет связи. Проверьте интернет и попробуйте снова.", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
  });
  inputEl.focus();
</script>

</body>
</html>
